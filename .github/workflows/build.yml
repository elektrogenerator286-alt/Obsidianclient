name: Build jar

on:
  push:
    branches: [visualhud]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Build
        run: |
          gradle build --no-daemon
          rm -f build/libs/*-sources.jar
          ls -la build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: obsidianclient-jar
          path: build/libs/*.jar
      # Каждая успешная сборка публикует jar в Releases (тег создаётся автоматически)
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Obsidian Client v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: Сборка из ветки visualhud, коммит ${{ github.sha }}
          files: build/libs/*.jar
